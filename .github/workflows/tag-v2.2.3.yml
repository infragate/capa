name: Tag v2.2.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-v2.2.3.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create and push v2.2.3
        run: |
          git tag v2.2.3 e568f969d27760b39a3553d957e0f9e23b0ad50d
          git push origin v2.2.3
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tag-v2.2.3.yml
          git commit -m "chore: remove one-shot v2.2.3 tag workflow"
          git push origin HEAD:main
