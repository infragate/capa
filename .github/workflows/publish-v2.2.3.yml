name: Publish v2.2.3

# One-shot: Actions cannot start workflows from a GITHUB_TOKEN tag push,
# so this user-token commit publishes the already-created v2.2.3 tag.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.2.3.yml'

permissions:
  contents: write

env:
  RELEASE_TAG: v2.2.3
  RELEASE_REF: refs/tags/v2.2.3

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            asset_name: capa-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
            asset_name: capa-aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            asset_name: capa-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            asset_name: capa-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            asset_name: capa-x86_64-pc-windows-msvc.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v2.2.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Generate version from tag
        run: bun run scripts/generate-version.ts
        env:
          GITHUB_REF: ${{ env.RELEASE_REF }}

      - name: Update install scripts version
        run: bun run scripts/update-install-scripts.ts
        env:
          GITHUB_REF: ${{ env.RELEASE_REF }}

      - name: Build web UI
        run: bun run build:web

      - name: Build
        env:
          BUN_TARGET: ${{ matrix.bun_target }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            bun build src/cli/index.ts --compile --target=$BUN_TARGET --windows-icon=./logo.ico --outfile dist/capa
          else
            bun build src/cli/index.ts --compile --target=$BUN_TARGET --outfile dist/capa --icon logo.ico
          fi
        shell: bash

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ -f "capa.exe" ]; then
            mv capa.exe ../capa-${{ matrix.target }}.exe
          else
            mv capa ../capa-${{ matrix.target }}
          fi

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ARTIFACT="capa-${{ matrix.target }}.exe"
            HASH=$(powershell -Command "(Get-FileHash '$ARTIFACT' -Algorithm SHA256).Hash.ToLower()")
            echo "$HASH  $ARTIFACT" > "${ARTIFACT}.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            ARTIFACT="capa-${{ matrix.target }}"
            sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          else
            ARTIFACT="capa-${{ matrix.target }}"
            shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: capa-${{ matrix.target }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v2.2.3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate SHA256SUMS.txt
        run: |
          find artifacts -name '*.sha256' -type f -exec cat {} \; | LC_ALL=C sort -k2 > SHA256SUMS.txt
          sha256sum install.sh install.ps1 >> SHA256SUMS.txt
          LC_ALL=C sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            SHA256SUMS.txt
            install.sh
            install.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.2.3
          name: v2.2.3
          target_commitish: e568f969d27760b39a3553d957e0f9e23b0ad50d
          files: |
            artifacts/**/*
            SHA256SUMS.txt
            install.sh
            install.ps1
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Remove one-shot workflow
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Delete workflow file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v2.2.3.yml
          git commit -m "chore: remove one-shot v2.2.3 publish workflow"
          git push origin HEAD:main
