name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Only uploads workflow artifacts; the release job publishes them.
    permissions:
      contents: read
    env:
      # Secrets can't be read in a step `if`; expose whether signing is set up.
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            artifact_name: capa
            asset_name: capa-x86_64-unknown-linux-gnu
          
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
            artifact_name: capa
            asset_name: capa-aarch64-unknown-linux-gnu
          
          # macOS x86_64 (Intel) — cross-compiled via --target on Apple Silicon runners
          - os: macos-latest
            target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            artifact_name: capa
            asset_name: capa-x86_64-apple-darwin
          
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            artifact_name: capa
            asset_name: capa-aarch64-apple-darwin
          
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            artifact_name: capa.exe
            asset_name: capa-x86_64-pc-windows-msvc.exe

          # Windows ARM64 falls back to the x64 binary via install.ps1
          # (`bun build --compile --target=bun-windows-arm64` is unstable as of
          # Bun 1.3.x — runtime download fails to extract). Windows on ARM64
          # runs x64 binaries fine under Prism emulation.
          #
          # Windows x86 (32-bit) is also unsupported because there is no
          # `bun-windows-i686` build target.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Stamp the version before `bun install`, which rewrites the lockfile.
      # RELEASE_REF can be set by a branch workflow that checks out an existing
      # tag. GITHUB_REF cannot: Actions ignores overrides of default GITHUB_* variables.
      - name: Generate version from tag
        run: bun run scripts/generate-version.ts
        env:
          RELEASE_REF: ${{ github.ref }}

      - name: Update install scripts version
        run: bun run scripts/update-install-scripts.ts
        env:
          RELEASE_REF: ${{ github.ref }}

      - name: Install dependencies
        run: bun install

      - name: Build web UI
        run: bun run build:web

      # @napi-rs/keyring loads its native addon with a dynamic require that
      # `bun build --compile` can't follow. Install the target's addon package
      # (cross-compiled jobs only get the host's by default) and generate a
      # static require of it so the binary embeds it.
      - name: Embed keyring addon for target
        env:
          BUN_TARGET: ${{ matrix.bun_target }}
        shell: bash
        run: |
          os=$(echo "$BUN_TARGET" | cut -d- -f2)
          cpu=$(echo "$BUN_TARGET" | cut -d- -f3)
          if [ "$os" == "windows" ]; then os=win32; fi
          bun install --os="$os" --cpu="$cpu"
          bun run scripts/generate-keyring-addon.ts

      - name: Build
        env:
          BUN_TARGET: ${{ matrix.bun_target }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            bun build src/cli/index.ts --compile --target=$BUN_TARGET --windows-icon=./logo.ico --outfile dist/capa
          else
            bun build src/cli/index.ts --compile --target=$BUN_TARGET --outfile dist/capa --icon logo.ico
          fi
        shell: bash

      # Sign macOS binaries with a stable Developer ID so the Keychain keeps
      # trusting capa across upgrades (#307). Skipped until the signing
      # secrets are configured, so releases still build without them.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          # Hardened runtime needs the JIT entitlements Bun's runtime uses.
          codesign --force --timestamp --options runtime \
            --identifier co.infragate.capa \
            --entitlements .github/macos-entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" --keychain "$KEYCHAIN" dist/capa
          codesign --verify --strict --verbose=2 dist/capa

          # A bare binary can't be stapled; notarizing still registers the
          # ticket so Gatekeeper accepts it online.
          ditto -c -k dist/capa "$RUNNER_TEMP/capa.zip"
          xcrun notarytool submit "$RUNNER_TEMP/capa.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait | tee "$RUNNER_TEMP/notary.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.log"

          security delete-keychain "$KEYCHAIN"

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ -f "capa.exe" ]; then
            mv capa.exe ../capa-${{ matrix.target }}.exe
          else
            mv capa ../capa-${{ matrix.target }}
          fi

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ARTIFACT="capa-${{ matrix.target }}.exe"
            HASH=$(powershell -Command "(Get-FileHash '$ARTIFACT' -Algorithm SHA256).Hash.ToLower()")
            echo "$HASH  $ARTIFACT" > "${ARTIFACT}.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            ARTIFACT="capa-${{ matrix.target }}"
            sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          else
            ARTIFACT="capa-${{ matrix.target }}"
            shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: capa-${{ matrix.target }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate SHA256SUMS.txt
        run: |
          find artifacts -name '*.sha256' -type f -exec cat {} \; | LC_ALL=C sort -k2 > SHA256SUMS.txt
          sha256sum install.sh install.ps1 >> SHA256SUMS.txt
          LC_ALL=C sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            SHA256SUMS.txt
            install.sh
            install.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
            install.sh
            install.ps1
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
